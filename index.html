<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Page</title>
    
</head>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href ="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<body>
    <div class="full-container" >
        <div class="navbar-container" >
            <p class="logo">
                Logo
            </p>
            <div class="side-navbar" >
                <ul class="Option-l" >
                    <!-- <li>Home</li> -->
                    <li>About</li>
                    <!-- <li>Services</li> -->
                    <li>Contact</li>
                    <li>
                        <button onclick="document.getElementById('id01').style.display='block'" class="subutton" id="T-login">Sign Up</button>
                    </li>
                </ul>
            </div>
        </div>
        <div class="login-container" >
            <!-- <div class="Cancel-btn"><button class="Cancel-btn"
                style="background-color: black; width: 40px; height: 40px;border-radius: 8px 0; display: flex; justify-self: flex-end; border-style: none; justify-content: center; align-items: center;"><i class="fa-solid fa-xmark" style="font-size: 25px;"></i></button></div>
            <div> -->
            <h2 class="Login-text">
                Login
            </h2>
            <div class="Username" >
                <input type="text" name="Text" id="Text" placeholder="Username"  >
            </div>

            <div class="Email" >
                <input type="email" name="Email" id="Email" placeholder="Email" autocomplete="email">
            </div>

            <div class="Password" >
                <input type="Password" name="Password" id="Password" placeholder="Password" >
            </div>
            
            <div class="Forgot-P">
                <div class="Remember" >
                    <input type="checkbox" name="checkbox" id="checkbox" unchecked>
                    <p id="Remember">
                        Remember me
                    </p>
                </div> 
                <a href="" id="Forget-P" >Forget Password?</a>
            </div>
            <div class="Login-btn" >
                <a href="/Login-page/Not-login.html">
                    <!-- javascript:void(0); -->
                    
                    <button id="Login-btn" type="button">
                        Login
                    </button>
                </a>
            </div>
            <div class="botton-ctnr">
                <p class="botton-text">Don't have an account? <!-- Button to open the modal -->
                    <button onclick="document.getElementById('id01').style.display='block'" class="sbutton">Sign Up</button>
                    
                    <!-- The Modal (contains the Sign Up form) -->
                    <div id="id01" class="modal">
                      <span onclick="document.getElementById('id01').style.display='none'" class="close" title="Close Modal"><button class="Cancel-btn" style="background-color: black; width: 40px; height: 40px;border-radius: 8px 0; display: flex; justify-self: flex-end; border-style: none; justify-content: center; align-items: center;"><i class="fa-solid fa-xmark" style="font-size: 25px;"></i></button></span>
                      <form class="modal-content" action="/Login-page/Not-login.html">
                        <div class="container">
                          <h1 style="justify-self: center;">Sign Up</h1>
                          <p style="justify-self: center;">Please fill in this form to create an account.</p>
                          <hr>
                          <label for="Username"><b>Username</b></label>
                          <input type="text" placeholder="Enter Username" id="sText" name="Username" required>

                          <label for="email"><b>Email</b></label>
                          <input type="text" placeholder="Enter Email" id="semail" name="email" required>
                    
                          <label for="psw"><b>Password</b></label>
                          <input type="Password" id="psw" placeholder="Enter Password" name="psw" required>
                    
                          <label for="psw-repeat"><b>Repeat Password</b></label>
                          <input type="Password" id="pswr" placeholder="Repeat Password" name="psw-repeat" required>
                    
                          <label>
                            <input type="checkbox" checked="checked" id="checkbox" name="remember" style="margin-bottom:15px"> Remember me
                          </label>
                    
                          <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>
                    
                          <div class="clearfix">
                            <button type="button" onclick="document.getElementById('id01').style.display='none'" class="cancelbtn">Cancel</button>
                            <a href="/Login-page/Not-login.html"><button type="submit" class="signup" id="signup">Sign Up</button></a>
                          </div>
                        </div>
                      </form>
                    </div>
                    </p>
            </div>
        </div>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
